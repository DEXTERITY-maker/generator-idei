<style>
  /* ---------- Цвета: светлая тема по умолчанию ---------- */
  :root {

  /* ---------- Категории ---------- */

  .cat {
    appearance: none; border: 1px solid var(--chip-line); background: var(--chip); color: var(--chip-text);

  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: var(--grad); }
  .card .body { display: grid; gap: 12px; transition: opacity 0.28s ease, transform 0.28s ease; }
  .card .body.out { opacity: 0; transform: translateY(12px); }
  .card .body.in { opacity: 0; transform: translateY(-12px); }
  .label { font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--label); }
  .title { margin: 0; font-size: clamp(24px, 5vw, 32px); font-weight: 800; line-height: 1.2; letter-spacing: -0.01em; }

  .export {

           background: var(--footer-bg); border-radius: 14px; padding: 10px 16px; }

  kbd { font: 600 12px ui-monospace, Menlo, monospace; padding: 1px 6px; border-radius: 5px; background: rgba(255, 255, 255, 0.18); }

  /* ---------- Уведомления (toast) ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 24px; z-index: 40;

  .confetti { position: fixed; top: 0; left: 0; width: 10px; height: 14px; border-radius: 2px; z-index: 30; pointer-events: none; animation: fall 2s ease-out forwards; }
  @keyframes fall {
    0% { transform: translate(0, 0) rotate(0); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
  }

  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .card button:focus-visible, .panel button:focus-visible { outline-color: var(--g1); }

  /* ---------- Телефон ---------- */
  @media (max-width: 480px) {
    .wrap { padding: 72px 14px 32px; gap: 16px; }

</style>

  {"id": 40, "category": "Уборка", "title": "Охота на носки-одиночки", "description": "Собери все непарные носки и устрой им сведение пар. Оставшимся одиночкам — новая жизнь в роли тряпок."},
  {"id": 41, "category": "Уборка", "title": "Расхламить телефон", "description": "Удали 200 лишних фото и 10 ненужных приложений. Телефон вздохнёт с облегчением и станет быстрее."},
  {"id": 42, "category": "Уборка", "title": "Пятиминутка каждого угла", "description": "Поставь таймер на 5 минут и убери только один угол. Маленькие победы накапливаются быстрее больших планов."},

  {"id": 48, "category": "Уборка", "title": "Уборка с подкастом", "description": "Совмести мытьё окон с интересным подкастом. Через час окна чистые, а ты знаешь что-то новое про древний Египет."},
  {"id": 49, "category": "Подарок", "title": "Банка 52 причин", "description": "Напиши 52 записки, за что ценишь человека, и сложи в банку — по одной на каждую неделю года."},
  {"id": 50, "category": "Подарок", "title": "Сертификат на услугу", "description": "Подари сертификат на твою помощь: генеральную уборку, вкусный ужин или день без бытовых дел."},
  {"id": 51, "category": "Подарок", "title": "Подарок-квест", "description": "Спрячь подарок и оставь цепочку подсказок по дому. Сам подарок может быть скромным — приключение будет главным."},
  {"id": 52, "category": "Подарок", "title": "Книга рецептов семьи", "description": "Собери любимые семейные рецепты с историями и фото в одну книжку. Бабушкины пирожки станут наследием."},

  {"id": 55, "category": "Подарок", "title": "Звезда в комнате", "description": "Подари ночник-проектор звёздного неба с запиской «Теперь у тебя есть личная галактика»."},
  {"id": 56, "category": "Подарок", "title": "Карта ваших мест", "description": "Нарисуй или распечатай карту с отмеченными местами, важными для вас двоих. Красиво и очень лично."},
  {"id": 57, "category": "Подарок", "title": "Растение с характером", "description": "Подари кактус с именем и «паспортом»: характер, любимая музыка, правила общения. Ухаживать станет веселее."},
  {"id": 58, "category": "Подарок", "title": "Подписка на впечатления", "description": "Вместо вещи подари серию из трёх совместных выходов: музей, мастер-класс, необычное кафе."},

  {"id": 60, "category": "Подарок", "title": "Письмо из прошлого", "description": "Напиши письмо, которое человек откроет через год, и запечатай с датой. Подарок, который сработает дважды."},
  {"id": 61, "category": "Саморазвитие", "title": "Десять новых слов в день", "description": "Учи по десять слов иностранного языка в день неделю. Используй каждое хотя бы раз, даже в разговоре с котом."},
  {"id": 62, "category": "Саморазвитие", "title": "Неделя без жалоб", "description": "Попробуй семь дней не жаловаться. Сорвался — начинай заново. Узнаешь, сколько энергии уходило на ворчание."},
  {"id": 63, "category": "Саморазвитие", "title": "Объяснить сложное ребёнку", "description": "Выбери сложную тему и объясни её так, чтобы понял восьмилетка. Если получилось — значит, сам понял."},
  {"id": 64, "category": "Саморазвитие", "title": "Утренние три страницы", "description": "Каждое утро пиши три страницы от руки о чём угодно. Через неделю голова станет заметно чище."},
  {"id": 65, "category": "Саморазвитие", "title": "Освоить один трюк", "description": "Научись жонглировать тремя мячами или фокусу с монетой за неделю. Бесполезно, но невероятно приятно."},
  {"id": 66, "category": "Саморазвитие", "title": "Читать по 20 страниц", "description": "Каждый вечер читай 20 страниц книги вместо листания ленты. За год это около 25 книг."},
  {"id": 67, "category": "Саморазвитие", "title": "Список страхов и первые шаги", "description": "Выпиши три страха и к каждому один крошечный шаг навстречу. Например, страх звонков — один звонок в пиццерию."},
  {"id": 68, "category": "Саморазвитие", "title": "День новых маршрутов", "description": "Пройди привычные пути новыми дорогами. Мозг любит новизну, а ты найдёшь пару неизвестных уголков."},

  {"id": 75, "category": "Отдых", "title": "Ванна с ритуалом", "description": "Соль, свечи, любимая музыка и книга, которую не жалко намочить. Час, когда весь мир подождёт."},

  {"id": 79, "category": "Отдых", "title": "Сон по расписанию младенца", "description": "Позволь себе дневной сон на 20 минут. Профессионалы сна — малыши и коты — знают толк в отдыхе."},

  {"id": 81, "category": "Отдых", "title": "Вечер настольных игр", "description": "Позови друзей на настолки с правилом: проигравший рассказывает самый смешной случай из жизни."},
  {"id": 82, "category": "Отдых", "title": "Прогулка без цели", "description": "Выйди из дома и на каждом перекрёстке подбрасывай монетку: орёл — направо, решка — налево."},

  {"id": 84, "category": "Отдых", "title": "Рыбалка без улова", "description": "Сходи на речку с удочкой, не ставя цели поймать рыбу. Главный улов — тишина и пара часов без мыслей."},
  {"id": 85, "category": "Семья", "title": "Семейное древо за вечер", "description": "Вместе со старшими родственниками составьте семейное древо. Вас ждут неожиданные истории про прадедушек."},

  {"id": 87, "category": "Семья", "title": "Семейная газета", "description": "Выпустите газету с новостями семьи: интервью с бабушкой, прогноз настроения, колонка про кота."},
  {"id": 88, "category": "Семья", "title": "Совместный ужин из детства", "description": "Каждый готовит блюдо из своего детства и рассказывает его историю. Вкусно и трогательно одновременно."},
  {"id": 89, "category": "Семья", "title": "Шалаш из одеял", "description": "Постройте крепость из одеял и подушек и проведите там вечер с фонариком и страшилками."},
  {"id": 90, "category": "Семья", "title": "Фотоальбом с подписями", "description": "Распечатайте фото за год и подпишите каждое смешными комментариями. Через годы это будет бесценно."},
  {"id": 91, "category": "Семья", "title": "Семейный совет с печеньем", "description": "Раз в месяц обсуждайте планы и желания за чаем. Правило: каждый говорит, остальные слушают и едят печенье."},
  {"id": 92, "category": "Семья", "title": "Звонок дальним родственникам", "description": "Позвоните тёте или дяде, с которыми давно не общались. Скорее всего, они будут очень рады."},
  {"id": 93, "category": "Семья", "title": "Посадить дерево вместе", "description": "Посадите дерево или куст и назовите в честь семейного события. Будете навещать его годами."},
  {"id": 94, "category": "Семья", "title": "Конкурс семейных талантов", "description": "Каждый показывает свой талант, даже если это умение шевелить ушами. Жюри — домашние питомцы."},
  {"id": 95, "category": "Семья", "title": "Интервью с бабушкой", "description": "Запишите на видео рассказы бабушки или дедушки о молодости. Истории, которых нет ни в одной книге."},
  {"id": 96, "category": "Семья", "title": "Неделя семейного челленджа", "description": "Выберите общую цель на неделю: без сладкого, по 10 тысяч шагов. Победители получают поблажку на выходных."},
  {"id": 97, "category": "Работа", "title": "Час без уведомлений", "description": "Отключи все уведомления на час и сделай самую сложную задачу дня. Окажется, что мир не рухнул."},
  {"id": 98, "category": "Работа", "title": "Метод помидора", "description": "Работай 25 минут, отдыхай 5. После четырёх циклов — длинный перерыв. Помидор не обязателен, таймер — да."},
  {"id": 99, "category": "Работа", "title": "Уборка рабочего стола", "description": "Оставь на столе только то, что нужно сегодня. Чистый стол — меньше поводов отвлекаться."},
  {"id": 100, "category": "Работа", "title": "Совещание стоя", "description": "Предложи провести планёрку стоя. Почему-то стоя все вдруг говорят короче и по делу."},
  {"id": 101, "category": "Работа", "title": "Список «не делать»", "description": "Составь список дел, которые ты больше не будешь делать или делегируешь. Он важнее любого списка задач."},
  {"id": 102, "category": "Работа", "title": "Благодарность коллеге", "description": "Напиши коллеге конкретное «спасибо» за помощь. Это займёт минуту, а настроение поднимет на неделю."},
  {"id": 103, "category": "Работа", "title": "Шаблоны для частых писем", "description": "Сделай заготовки для пяти писем, которые пишешь чаще всего. Сэкономишь часы в месяц."},
  {"id": 104, "category": "Работа", "title": "Обед вдали от компьютера", "description": "Ешь не за рабочим столом, а хотя бы у окна или на улице. Еда вкуснее, голова свежее."},
  {"id": 105, "category": "Работа", "title": "Самое страшное — первым", "description": "Начни день с задачи, которую больше всего хочется отложить. Дальше день покажется прогулкой."},
  {"id": 106, "category": "Работа", "title": "Пятничный итог недели", "description": "В пятницу запиши три сделанных дела и одно, которое можно улучшить. Маленькая привычка, большой рост."},
  {"id": 107, "category": "Работа", "title": "Научиться горячим клавишам", "description": "Выучи пять сочетаний клавиш в программе, где работаешь больше всего. Коллеги решат, что ты хакер."},
  {"id": 108, "category": "Работа", "title": "Прогулка-совещание", "description": "Обсудите рабочий вопрос во время прогулки. На свежем воздухе идеи приходят быстрее, а споры стихают."},
  {"id": 109, "category": "Путешествия", "title": "Поезд в незнакомый город", "description": "Купи билет на ближайший поезд в город, где никогда не был, и проведи там один день."},
  {"id": 110, "category": "Путешествия", "title": "Путешествие по еде", "description": "Устрой поездку ради одной местной еды: пирожков, рыбы или сыра. Цель вкусная — маршрут подстроится."},
  {"id": 111, "category": "Путешествия", "title": "Карта желаний на стене", "description": "Повесь карту и отмечай флажками места, куда хочешь поехать. Каждый флажок — маленькое обещание себе."},
  {"id": 112, "category": "Путешествия", "title": "Поход с ночёвкой рядом", "description": "Выберись с палаткой на одну ночь в лес недалеко от города. Приключение без отпуска и больших затрат."},
  {"id": 113, "category": "Путешествия", "title": "Дневник путешествия рисунками", "description": "Вместо фото зарисовывай каждый день поездки в блокнот. Даже кривые рисунки запоминаются лучше снимков."},
  {"id": 114, "category": "Путешествия", "title": "Путешествие налегке", "description": "Отправься в поездку только с рюкзаком. Удивишься, как мало вещей на самом деле нужно для счастья."},
  {"id": 115, "category": "Путешествия", "title": "Открытка себе из каждого города", "description": "В каждом новом месте отправляй себе открытку домой. Вернувшись, получишь письма от самого себя."},
  {"id": 116, "category": "Путешествия", "title": "Маршрут по заброшенным станциям", "description": "Найди старые станции или усадьбы рядом с городом и устрой фотоэкскурсию. Соблюдай безопасность."},
  {"id": 117, "category": "Путешествия", "title": "Выучить 20 фраз перед поездкой", "description": "Перед поездкой за границу выучи 20 фраз на местном языке. Местные оценят даже ужасное произношение."},
  {"id": 118, "category": "Путешествия", "title": "Велопоездка на выходные", "description": "Проложи маршрут на 30–50 км по живописным местам. Ноги будут против, а душа — за."},
  {"id": 119, "category": "Путешествия", "title": "Ночёвка в необычном месте", "description": "Найди глэмпинг, домик на дереве или маяк для ночёвки. Обычная гостиница больше не будет прежней."},
  {"id": 120, "category": "Путешествия", "title": "Путешествие по случайной точке", "description": "Ткни пальцем в карту региона с закрытыми глазами и съезди туда. Если попал в болото — выбирай снова."}
];

(function () {
  /* ---------- Состояние ---------- */
  const FAV_KEY = "fav_ideas", THEME_KEY = "theme", COUNT_KEY = "gen_count";
  const CATS = ["Все"].concat(Array.from(new Set(IDEAS.map(function (i) { return i.category; }))));
  const $ = function (id) { return document.getElementById(id); };
  const byId = function (id) { return IDEAS.find(function (i) { return i.id === id; }); };

  let currentCat = "Все";
  let current = null;
  let recent = [];                       // последние 5 показанных идей, только в памяти
  let favs = readJSON(FAV_KEY, []).filter(function (id) { return !!byId(id); });
  let genCount = parseInt(read(COUNT_KEY), 10) || 0;

  /* ---------- localStorage с защитой (приватный режим, запрет хранилища) ---------- */
  function read(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function write(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function readJSON(k, def) { try { const v = JSON.parse(read(k)); return Array.isArray(v) ? v : def; } catch (e) { return def; } }

  /* ---------- Уведомления ---------- */
  let toastTimer = null;
  function toast(text) {
    const t = $("toast");
    t.textContent = text;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2000);
  }

  /* ---------- Тема ---------- */
  function applyTheme(dark) {
    if (dark) document.documentElement.setAttribute("data-theme", "dark");
    else document.documentElement.removeAttribute("data-theme");
    const b = $("themeBtn");
    b.textContent = dark ? "☀️" : "🌙";
    b.setAttribute("aria-label", dark ? "Светлая тема" : "Тёмная тема");
    b.title = (dark ? "Светлая тема" : "Тёмная тема") + " (D)";
    const tc = $("themeColor"); if (tc) tc.setAttribute("content", dark ? "#1a202c" : "#667eea");
  }
  function toggleTheme() {
    const dark = document.documentElement.getAttribute("data-theme") !== "dark";
    applyTheme(dark);
    write(THEME_KEY, dark ? "dark" : "light");
  }

  /* ---------- Категории с количеством идей ---------- */
  function renderCats() {
    const box = $("cats");
    box.textContent = "";
    CATS.forEach(function (c) {
      const count = c === "Все" ? IDEAS.length : IDEAS.filter(function (i) { return i.category === c; }).length;
      const b = document.createElement("button");
      b.type = "button";
      b.className = "cat" + (c === currentCat ? " active" : "");
      b.setAttribute("aria-pressed", String(c === currentCat));
      const s = document.createElement("span"); s.textContent = c;
      const n = document.createElement("span"); n.className = "n"; n.textContent = " · " + count;
      b.append(s, n);
      b.addEventListener("click", function () {
        if (currentCat === c) return;
        currentCat = c;
        renderCats();
        if (!current || (c !== "Все" && current.category !== c)) show(pickRandom(), true);
      });
      box.append(b);
    });
  }

  /* ---------- Выбор идеи: без повтора предыдущей ---------- */
  function pool() { return currentCat === "Все" ? IDEAS : IDEAS.filter(function (i) { return i.category === currentCat; }); }
  function pickRandom() {
    const p = pool();
    if (!p.length) return null;
    if (p.length === 1) return p[0];
    let next;
    do { next = p[Math.floor(Math.random() * p.length)]; } while (current && next.id === current.id);
    return next;
  }

  /* ---------- Показ в карточке с плавной сменой ---------- */
  let animating = false;
  function paint(idea) {
    $("cardCat").textContent = idea.category;
    $("cardTitle").textContent = idea.title;
    $("cardDesc").textContent = idea.description;
    paintFav();
  }
  function show(idea, remember) {
    if (!idea) return;
    if (remember) addRecent(idea);
    const body = $("cardBody");
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!current || reduce || animating) { current = idea; paint(idea); return; }
    animating = true;
    body.classList.add("out");
    setTimeout(function () {
      current = idea;
      paint(idea);
      body.classList.remove("out");
      body.classList.add("in");
      void body.offsetWidth;            // перезапуск перехода
      body.classList.remove("in");
      setTimeout(function () { animating = false; }, 280);
    }, 280);
  }

  /* ---------- Генерация и счётчик ---------- */
  function generate() {
    show(pickRandom(), true);
    genCount += 1;
    write(COUNT_KEY, String(genCount));
    $("genCount").textContent = genCount;
  }
  function resetCount() {
    if (!confirm("Сбросить счётчик сгенерированных идей?")) return;
    genCount = 0;
    write(COUNT_KEY, "0");
    $("genCount").textContent = "0";
    toast("Счётчик сброшен");
  }

  /* ---------- Недавние (последние 5) ---------- */
  function addRecent(idea) {
    recent = [idea.id].concat(recent.filter(function (id) { return id !== idea.id; })).slice(0, 5);
    renderRecent();
  }
  function renderRecent() {
    const list = $("recentList");
    list.textContent = "";
    recent.forEach(function (id) {
      const idea = byId(id);
      const li = document.createElement("li"); li.className = "item";
      const open = document.createElement("button"); open.type = "button"; open.className = "open";
      const c = document.createElement("div"); c.className = "c"; c.textContent = idea.category;
      const t = document.createElement("div"); t.className = "t"; t.textContent = idea.title;
      open.append(c, t);
      open.addEventListener("click", function () { show(idea, false); });
      li.append(open);
      list.append(li);
    });
  }

  /* ---------- Избранное ---------- */
  function paintFav() {
    const on = current && favs.indexOf(current.id) !== -1;
    const b = $("favBtn");
    b.textContent = on ? "💖" : "🤍";
    b.setAttribute("aria-pressed", String(!!on));
    b.setAttribute("aria-label", on ? "Убрать из избранного" : "Добавить в избранное");
  }
  function toggleFav(id, fromEl) {
    const at = favs.indexOf(id);
    if (at === -1) { favs.push(id); toast("Добавлено в избранное 💖"); confetti(fromEl || $("favBtn")); }
    else { favs.splice(at, 1); toast("Удалено из избранного"); }
    write(FAV_KEY, JSON.stringify(favs));
    paintFav();
    renderFavs();
  }
  function renderFavs() {
    const list = $("favList");
    list.textContent = "";
    favs.forEach(function (id) {
      const idea = byId(id);
      const li = document.createElement("li"); li.className = "item";
      const open = document.createElement("button"); open.type = "button"; open.className = "open"; open.title = "Показать в карточке";
      const c = document.createElement("div"); c.className = "c"; c.textContent = idea.category;
      const t = document.createElement("div"); t.className = "t"; t.textContent = idea.title;
      open.append(c, t);
      open.addEventListener("click", function () { show(idea, false); window.scrollTo({ top: 0, behavior: "smooth" }); });
      const del = document.createElement("button"); del.type = "button"; del.className = "del"; del.textContent = "×";
      del.setAttribute("aria-label", "Удалить «" + idea.title + "» из избранного");
      del.addEventListener("click", function () { toggleFav(id); });
      li.append(open, del);
      list.append(li);
    });
    $("favEmpty").hidden = favs.length > 0;
    $("exportBtn").hidden = favs.length === 0;
  }

  /* ---------- Экспорт избранного в favorites.txt ---------- */
  function exportFavs() {
    const text = favs.map(function (id) { const i = byId(id); return i.category + "\n" + i.title + "\n" + i.description; }).join("\n\n") + "\n";
    const url = URL.createObjectURL(new Blob([text], { type: "text/plain;charset=utf-8" }));
    const a = document.createElement("a");
    a.href = url; a.download = "favorites.txt";
    document.body.append(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  /* ---------- Конфетти: ~30 частиц, 2 секунды ---------- */
  function confetti(fromEl) {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const r = fromEl.getBoundingClientRect();
    const x = r.left + r.width / 2, y = r.top + r.height / 2;
    const colors = ["#667eea", "#764ba2", "#f6ad55", "#f56565", "#48bb78", "#ecc94b", "#ed64a6"];
    for (let i = 0; i < 30; i++) {
      const p = document.createElement("div");
      p.className = "confetti";
      const angle = Math.random() * Math.PI * 2, dist = 80 + Math.random() * 160;
      p.style.left = x + "px";
      p.style.top = y + "px";
      p.style.background = colors[i % colors.length];
      p.style.setProperty("--dx", Math.cos(angle) * dist + "px");
      p.style.setProperty("--dy", Math.sin(angle) * dist + 120 + "px");   // разлёт и падение вниз
      p.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
      p.style.animationDelay = (Math.random() * 0.15) + "s";
      document.body.append(p);
      setTimeout(function () { p.remove(); }, 2300);
    }
  }

  /* ---------- Копирование (с запасным путём для file:// и старых браузеров) ---------- */
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise(function (resolve, reject) {
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", "");
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.append(ta); ta.select();
      try { document.execCommand("copy") ? resolve() : reject(); } catch (e) { reject(e); }
      ta.remove();
    });
  }
  let copyTimer = null;
  function copyCurrent() {
    if (!current) return;
    const btn = $("copyBtn");
    copyText(current.title + "\n" + current.description).then(function () {
      btn.textContent = "✅";
      toast("Скопировано ✅");
      clearTimeout(copyTimer);
      copyTimer = setTimeout(function () { btn.textContent = "📋"; }, 1200);
    }).catch(function () { toast("Не удалось скопировать — выделите текст вручную"); });
  }

  /* ---------- Поделиться: Web Share API или ссылка + текст в буфер ---------- */
  function shareCurrent() {
    if (!current) return;
    const text = current.title + "\n" + current.description;
    if (navigator.share) {
      navigator.share({ title: "Генератор идей", text: text }).catch(function () {});   // отмена — не ошибка
    } else {
      copyText(location.href + "\n\n" + text)
        .then(function () { toast("Скопировано!"); })
        .catch(function () { toast("Не удалось скопировать — выделите текст вручную"); });
    }
  }

  /* ---------- Сброс счётчика: двойной клик или долгое нажатие ---------- */
  const countEl = $("genCount");
  let pressTimer = null;
  countEl.addEventListener("dblclick", resetCount);
  countEl.addEventListener("pointerdown", function () { pressTimer = setTimeout(function () { pressTimer = null; resetCount(); }, 700); });
  ["pointerup", "pointerleave", "pointercancel"].forEach(function (t) {
    countEl.addEventListener(t, function () { clearTimeout(pressTimer); });
  });
  countEl.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  /* ---------- Кнопки ---------- */
  $("genBtn").addEventListener("click", generate);
  $("copyBtn").addEventListener("click", copyCurrent);
  $("shareBtn").addEventListener("click", shareCurrent);
  $("favBtn").addEventListener("click", function () { if (current) toggleFav(current.id, this); });
  $("exportBtn").addEventListener("click", exportFavs);
  $("themeBtn").addEventListener("click", toggleTheme);

  /* ---------- Клавиши (e.code — работает и на русской раскладке) ---------- */
  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA" || (e.target && e.target.isContentEditable)) return;
    if ((e.key === " " || e.key === "Enter") && tag !== "BUTTON") { e.preventDefault(); generate(); }
    else if (e.code === "KeyC") copyCurrent();
    else if (e.code === "KeyF") { if (current) toggleFav(current.id); }
    else if (e.code === "KeyD") toggleTheme();
  });

  /* ---------- Старт ---------- */
  applyTheme(read(THEME_KEY) === "dark");
  countEl.textContent = genCount;
  renderCats();
  renderFavs();
  show(pickRandom(), true);
})();
</script>
</body>
</html>
